name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: foodmap
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci-only@localhost:5432/foodmap
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-only
      PGDATABASE: foodmap
      FOODMAP_TEST_DATABASE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test && npm run data:validate && npm run build
      - run: npm run db:migrate && npm run db:migrate && npm run db:seed && npm run test:db
      - name: Backup and restore rehearsal
        run: |
          npm run db:maintenance -- on
          npm run db:backup -- backups/ci
          createdb foodmap_restore
          DATABASE_URL=postgres://postgres:ci-only@localhost:5432/foodmap_restore PGDATABASE=foodmap_restore RESTORE_TO_EMPTY=1 npm run db:restore -- backups/ci
          DATABASE_URL=postgres://postgres:ci-only@localhost:5432/foodmap_restore PGDATABASE=foodmap_restore npm run db:verify -- backups/ci
      - name: Validate Compose
        run: POSTGRES_PASSWORD=ci-only API_DATABASE_PASSWORD=ci-api docker compose config --quiet
      - name: Build and exercise self-hosted stack
        env:
          POSTGRES_PASSWORD: ci-compose-only
          API_DATABASE_PASSWORD: ci-api-only
        run: |
          docker compose up --build -d
          docker compose exec -T web nginx -t
          docker compose --profile demo run --rm seed
          curl --fail --retry 20 --retry-connrefused --retry-delay 2 http://localhost:8080/backend/health | jq -e '.status == "ok"'
          curl --fail http://localhost:8080/backend/api/catalog | jq -e '.venues | length == 7'
          node scripts/verify-static-http.mjs http://localhost:8080
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/backend/api/catalog)" = "405"
