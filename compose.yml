name: nju-foodmap
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foodmap
      POSTGRES_DB: foodmap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      API_DATABASE_PASSWORD: ${API_DATABASE_PASSWORD:?Set API_DATABASE_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
      - ./deploy/init-api-user.sh:/docker-entrypoint-initdb.d/10-api-user.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U foodmap -d foodmap]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  migrate:
    build: { context: ., target: api }
    command: [node, scripts/migrate.mjs]
    environment:
      PGHOST: db
      PGUSER: foodmap
      PGDATABASE: foodmap
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db: { condition: service_healthy }
  api:
    build: { context: ., target: api }
    environment:
      PGHOST: db
      PGUSER: foodmap_api
      PGDATABASE: foodmap
      PGPASSWORD: ${API_DATABASE_PASSWORD}
      PORT: 8787
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
  web:
    build: { context: ., target: web }
    ports: ['127.0.0.1:8080:80']
    volumes:
      - ./storage-data/public:/srv/media:ro
    depends_on: [api]
    restart: unless-stopped
  seed:
    profiles: [demo]
    build: { context: ., target: build }
    command: [npm, run, db:seed]
    environment:
      PGHOST: db
      PGUSER: foodmap
      PGDATABASE: foodmap
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      migrate: { condition: service_completed_successfully }
volumes:
  database:
