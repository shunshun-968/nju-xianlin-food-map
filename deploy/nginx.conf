server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  client_max_body_size 1m;
  location / { try_files $uri $uri/ /index.html; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location /backend/ { proxy_pass http://api:8787/; proxy_set_header Host $host; }
  # Only reviewed public images belong in this directory. Never mount the pending bucket here.
  location /media/ { alias /srv/media/; autoindex off; }
}
