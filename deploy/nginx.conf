# 不带内容哈希的入口和目录始终重验证，避免新版页面配上旧目录。
map $uri $foodmap_cache_control {
  default "no-cache";
  ~^/assets/ "public, max-age=31536000, immutable";
  "~^/osm/runtime/[^/]+\.[a-f0-9]{16}\.json$" "public, max-age=31536000, immutable";
  ~^/backend/ "";
  ~^/media/ "";
}

upstream foodmap_api {
  server api:8787;
  keepalive 16;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Cache-Control $foodmap_cache_control;
  sendfile on;
  tcp_nopush on;
  etag on;
  # 首访也可发送构建期压缩文件；旧构建没有 .gz 时使用动态压缩。
  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css text/plain text/javascript application/javascript application/json application/geo+json image/svg+xml application/wasm;
  client_max_body_size 1m;
  location / { try_files $uri $uri/ /index.html; }
  location /assets/ { try_files $uri =404; }
  location /osm/ { try_files $uri =404; }
  location /backend/ {
    proxy_pass http://foodmap_api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
  }
  # Only reviewed public images belong in this directory. Never mount the pending bucket here.
  location /media/ { alias /srv/media/; autoindex off; }
}
